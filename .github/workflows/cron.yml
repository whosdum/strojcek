name: Cron Jobs (manual fallback)

# The scheduled cron has moved to Firebase Scheduled Functions
# (functions/src/index.ts → sendReminders). This workflow is kept ONLY as
# a manual emergency trigger — if the Firebase function is down or you
# want to replay the daily run, dispatch this workflow from the GitHub UI
# or via `gh workflow run cron.yml`.
#
# To remove this fallback entirely once you are confident in the Firebase
# function: delete this file.

on:
  workflow_dispatch: # manual trigger only

concurrency:
  group: cron-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS -f --max-time 120 -X GET "${APP_URL}/api/cron/reminders" \
            -H "Authorization: Bearer ${CRON_SECRET}"
