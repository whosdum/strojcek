<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Motýlik — symbol svadby a slávnostných príležitostí">
  <rect width="800" height="450" fill="#f5f1ea"/>
  <!-- Bow tie centered -->
  <g transform="translate(180 130)">
    <!-- Left wing (with shadow) -->
    <path d="M 0 90 L 170 30 L 170 230 L 0 170 Q -8 130 0 90 Z"
          fill="#c25a1f" stroke="#2b1810" stroke-width="5" stroke-linejoin="round"/>
    <!-- Right wing (with shadow) -->
    <path d="M 440 90 L 270 30 L 270 230 L 440 170 Q 448 130 440 90 Z"
          fill="#c25a1f" stroke="#2b1810" stroke-width="5" stroke-linejoin="round"/>
    <!-- Left wing highlight (primary orange) -->
    <path d="M 8 100 L 168 40 L 168 200 L 8 160 Q 0 130 8 100 Z"
          fill="#fc873a"/>
    <!-- Right wing highlight -->
    <path d="M 432 100 L 272 40 L 272 200 L 432 160 Q 440 130 432 100 Z"
          fill="#fc873a"/>
    <!-- Center knot -->
    <rect x="170" y="80" width="100" height="100" rx="10" fill="#2b1810"/>
    <!-- Knot highlight band -->
    <rect x="180" y="92" width="14" height="76" rx="6" fill="#f5f1ea" opacity="0.85"/>
    <!-- Tiny pleat details on wings -->
    <line x1="40"  y1="80"  x2="40"  y2="180" stroke="#2b1810" stroke-width="3" opacity="0.5"/>
    <line x1="400" y1="80"  x2="400" y2="180" stroke="#2b1810" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
