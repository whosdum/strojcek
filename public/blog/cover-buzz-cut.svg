<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Profesionálny strihací strojček s káblom">
  <rect width="800" height="450" fill="#f5f1ea"/>
  <!-- Hair clipper, horizontal, centered -->
  <g transform="translate(150 150)">
    <!-- Cord curving away to the right -->
    <path d="M 500 90 Q 540 60 560 110 Q 580 160 540 180 Q 500 200 540 230 Q 580 260 600 250" fill="none" stroke="#2b1810" stroke-width="6" stroke-linecap="round"/>
    <!-- Cord plug at end -->
    <rect x="588" y="232" width="30" height="36" rx="4" fill="#2b1810"/>
    <rect x="610" y="240" width="14" height="6" fill="#f5f1ea"/>
    <rect x="610" y="254" width="14" height="6" fill="#f5f1ea"/>
    <!-- Cord entry collar -->
    <rect x="492" y="78" width="22" height="30" rx="3" fill="#2b1810"/>
    <!-- Main body (orange) -->
    <path d="M 80 0 L 470 0 Q 490 0 490 20 L 490 160 Q 490 180 470 180 L 80 180 Q 60 180 60 160 L 60 50 Z" fill="#fc873a" stroke="#2b1810" stroke-width="5" stroke-linejoin="round"/>
    <!-- Switch / button on top -->
    <rect x="180" y="20" width="100" height="28" rx="14" fill="#2b1810"/>
    <circle cx="260" cy="34" r="8" fill="#fc873a"/>
    <!-- Brand stripe (decorative) -->
    <rect x="100" y="100" width="350" height="14" rx="4" fill="#2b1810" opacity="0.85"/>
    <!-- Indicator light -->
    <circle cx="430" cy="60" r="10" fill="#c25a1f" stroke="#2b1810" stroke-width="3"/>
    <!-- Blade head (left side, with teeth) -->
    <rect x="-30" y="50" width="100" height="80" rx="6" fill="#2b1810"/>
    <!-- Teeth (sharp triangles on left edge) -->
    <g fill="#f5f1ea">
      <polygon points="-32,55 -52,65 -32,65"/>
      <polygon points="-32,75 -52,85 -32,85"/>
      <polygon points="-32,95 -52,105 -32,105"/>
      <polygon points="-32,115 -52,125 -32,125"/>
    </g>
    <!-- Inner blade line -->
    <rect x="-20" y="78" width="80" height="20" fill="#fc873a"/>
  </g>
</svg>
